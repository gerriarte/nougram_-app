<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido a Nougram</title>
</head>
<body style="margin:0;padding:0;background-color:#ebebf0;font-family:Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#ebebf0;padding:24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #d4d4dc;box-shadow:0 1px 3px rgba(38,37,55,.06);">
          <tr>
            <td style="padding:20px 24px;text-align:center;background:#262537;">
              <a href="https://www.nougram.co" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-block;">
                <img src="https://www.nougram.co/logo-nougram.png" alt="Nougram" width="140" style="display:block;margin:0 auto;border:0;outline:none;max-width:140px;width:140px;height:auto;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#F35D0A;" />
              </a>
            </td>
          </tr>
          <tr>
            <td style="background:#262537;color:#ffffff;padding:24px 24px 28px;text-align:center;border-top:1px solid rgba(243,93,10,.25);">
              <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em;">Bienvenido a Nougram</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px;color:#262537;line-height:1.6;font-size:15px;">
              <p style="margin:0 0 16px;">Hola <strong>{{full_name}}</strong>,</p>
              <p style="margin:0 0 16px;">Tu organización <strong>{{organization_name}}</strong> fue creada exitosamente.</p>
              <p style="margin:0 0 24px;">Ya puedes ingresar y completar tu configuración inicial.</p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 auto;">
                <tr>
                  <td style="border-radius:8px;background:#F35D0A;">
                    <a href="{{login_url}}" style="display:inline-block;padding:12px 24px;color:#ffffff !important;text-decoration:none;font-weight:600;font-size:15px;">Ir a Nougram</a>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0;font-size:12px;color:#5c5d70;">Si no reconoces este registro, contacta soporte.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
