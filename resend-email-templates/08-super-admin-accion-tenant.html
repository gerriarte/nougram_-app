<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acción tenant · Nougram</title>
</head>
<body style="margin:0;padding:0;background-color:#ebebf0;font-family:Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#ebebf0;padding:24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:640px;background:#ffffff;border-radius:12px;border:1px solid #d4d4dc;overflow:hidden;">
          <tr>
            <td style="padding:20px 24px;text-align:center;background:#262537;">
              <a href="https://www.nougram.co" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-block;">
                <img src="https://www.nougram.co/logo-nougram.png" alt="Nougram" width="140" style="display:block;margin:0 auto;border:0;outline:none;max-width:140px;width:140px;height:auto;font-size:14px;color:#F35D0A;" />
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 24px;background:#262537;color:#ffffff;border-top:1px solid rgba(243,93,10,.25);">
              <p style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.85);">Nougram · Super admin</p>
              <p style="margin:8px 0 0;font-size:18px;font-weight:600;">Acción de cuenta / facturación</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;color:#262537;line-height:1.55;font-size:14px;">
              <p style="margin:0 0 12px;"><strong>Organización:</strong> {{organization_name}} <span style="color:#5c5d70;">(ID {{organization_id}})</span></p>
              <p style="margin:0 0 12px;"><strong>Usuario:</strong> {{actor_full_name}} &lt;{{actor_email}}&gt;</p>
              <p style="margin:0 0 16px;"><strong>Acción:</strong> <span style="color:#F35D0A;font-weight:600;">{{action_label}}</span></p>
              <p style="margin:0 0 8px;font-size:12px;color:#5c5d70;text-transform:uppercase;">Detalles</p>
              {{details_block_html}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
