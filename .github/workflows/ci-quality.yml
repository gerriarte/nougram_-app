name: Calidad del Código (CI)

# Ejecuta solo cuando cambia el front real del monorepo o este workflow (evita fallos por rutas obsoletas `frontend/`).
on:
  push:
    branches: ["develop", "main"]
    paths:
      - "nougram_front/**"
      - ".github/workflows/ci-quality.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "nougram_front/**"
      - ".github/workflows/ci-quality.yml"

jobs:
  build-and-test:
    name: Compilar y Verificar (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nougram_front

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nougram_front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

      - name: Tests (si existen)
        run: npm test --if-present
