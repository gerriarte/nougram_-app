name: Frontend Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'nougram_front/**'
      - '.github/workflows/frontend-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'nougram_front/**'
      - '.github/workflows/frontend-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nougram_front

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: nougram_front/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Check TypeScript
      run: npx tsc --noEmit




